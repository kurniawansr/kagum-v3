name: Deploy KAGUM to cPanel Otomatis

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy ke Hosting cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Compile React & Siapkan Build cPanel
        run: npm run build

      - name: 5. Validasi Direktori Rilis
        run: |
          echo "=== Memeriksa folder rilis .cpanel-build ==="
          if [ ! -d ".cpanel-build" ]; then
            echo "Folder .cpanel-build belum ada, menyiapkan dari dist/..."
            mkdir -p .cpanel-build
            cp -r dist/* .cpanel-build/
            [ -f public/api.php ] && cp public/api.php .cpanel-build/
            [ -f public/update.php ] && cp public/update.php .cpanel-build/
            [ -f public/.htaccess ] && cp public/.htaccess .cpanel-build/
            [ -f public/schema.sql ] && cp public/schema.sql .cpanel-build/
          fi
          echo "Daftar file yang siap dikirim ke hosting:"
          ls -la .cpanel-build/

      - name: 6. Simpan Paket Rilis ZIP sebagai Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-siap-upload-v3.6
          path: public/cpanel-siap-upload.zip
          retention-days: 14

      - name: 7. Deploy Otomatis ke Hosting cPanel via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_SERVER: ${{ secrets.CPANEL_SERVER }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          HOST: ${{ secrets.HOST }}
          SERVER: ${{ secrets.SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USER: ${{ secrets.FTP_USER }}
          CPANEL_FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          TARGET_DIR: ${{ secrets.TARGET_DIR }}
        run: node scripts/deploy-ftp.cjs
