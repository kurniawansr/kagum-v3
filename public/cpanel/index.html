  <head>

    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="margin:20px; padding:24px; background:#fef2f2; border:2px solid #ef4444; border-radius:16px; font-family:sans-serif; color:#991b1b; max-width:600px; margin:40px auto; shadow:0 10px 25px rgba(0,0,0,0.1);">' +
            '<h3 style="margin-top:0; color:#b91c1c; font-size:18px; display:flex; align-items:center; gap:8px;">⚠️ Gagal Memuat Aplikasi (JavaScript Error)</h3>' +
            '<p style="font-size:14px; margin:8px 0;"><b>Detail Error:</b> ' + msg + '</p>' +
            '<p style="font-size:12px; color:#7f1d1d; background:#fee2e2; padding:8px 12px; border-radius:8px; font-family:monospace; word-break:break-all;">' + (url || 'File lokal/assets') + ' : baris ' + lineNo + '</p>' +
            '<hr style="border:0; border-top:1px solid #fca5a5; margin:16px 0;">' +
            '<p style="font-size:12px; color:#7f1d1d; margin-bottom:0;">💡 <b>Solusi:</b> Buka Console Browser (Tekan F12 -> tab Console) untuk melihat pesan teknis. Pastikan folder <b>assets</b> dan file <b>.htaccess</b> terupload sempurna ke cPanel.</p>' +
            '</div>';
        }
        return false;
      };
    </script>
    <script type="module" crossorigin src="./assets/index-Dv-UKaV4.js"></script>
